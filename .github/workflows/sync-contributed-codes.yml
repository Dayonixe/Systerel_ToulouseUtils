name: Sync approved Refectory codes

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync-and-build:
    if: vars.REFECTORY_CODES_FEED_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    concurrency:
      group: refectory-data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - run: pip install -r automation/requirements.txt
      - run: python -m pytest automation/tests

      - name: Import approved contributed codes
        env:
          REFECTORY_CODES_FEED_URL: ${{ vars.REFECTORY_CODES_FEED_URL }}
        run: python -m automation.refectory.contributions

      - name: Detect a published-code change
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/data/refectory-offers.json public/data/refectory-approved-codes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the approved code
        if: steps.changes.outputs.changed == 'true'
        run: python -m automation.maintenance

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm test
        if: steps.changes.outputs.changed == 'true'
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
        env:
          VITE_REFECTORY_FORM_URL: ${{ vars.VITE_REFECTORY_FORM_URL }}

      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: sync-and-build
    if: needs.sync-and-build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
