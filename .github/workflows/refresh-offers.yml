name: Refresh Refectory offers

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - run: pip install -r automation/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest automation/tests

      - name: Extract current Refectory offers
        id: extract
        continue-on-error: true
        run: python -m automation.refectory.export

      - name: Import approved contributed codes
        id: contributions
        continue-on-error: true
        env:
          REFECTORY_CODES_FEED_URL: ${{ vars.REFECTORY_CODES_FEED_URL }}
        run: python -m automation.refectory.contributions

      - name: Commit changed offers or maintain scheduled workflows
        run: python -m automation.maintenance --threshold-days 55

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_REFECTORY_FORM_URL: ${{ vars.VITE_REFECTORY_FORM_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report extraction failure
        if: steps.extract.outcome == 'failure'
        run: exit 1

      - name: Report contribution import failure
        if: steps.contributions.outcome == 'failure'
        run: exit 1
